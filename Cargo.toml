[package]
name = "psbox"
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
description = "Private-home application sandboxes for Linux"
license = "MIT"
publish = false

[lints.rust]
# Set by cargo-fuzz for the targets in fuzz/.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = { version = "=4.6.11", features = ["unstable-dynamic"] }
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[profile.release]
strip = true
