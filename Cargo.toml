[package]
name = "psbox"
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
description = "Private-home application sandboxes for Linux"
license = "MIT"
publish = false

[lints.rust]
# Set by cargo-fuzz for the targets in fuzz/.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = { version = "=4.6.11", features = ["unstable-dynamic"] }
libc = "0.2.190"
rsjsonnet-lang = "0.5.0"
sctk-adwaita = { version = "0.12.0", default-features = false, features = ["skrifa"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smithay-client-toolkit = { version = "0.21.1", default-features = false }
wayland-backend = "0.3.17"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }

[profile.release]
strip = true
