# cargo-deny policy (`make check/deny`). See AGENTS.md, "Dependencies and
# licenses".

[graph]
# The release targets; platform-specific crates for other systems are not
# part of any build.
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
all-features = true

[licenses]
# Permissive licenses and MPL-2.0 only: no GPL, LGPL, AGPL, SSPL, BUSL,
# Commons Clause, PolyForm, proprietary, custom, or unclear licenses.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[bans]
wildcards = "deny"
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"
