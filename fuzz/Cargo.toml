[package]
name = "psbox-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
psbox = { path = ".." }

# A workspace of its own, so the main crate's builds never pull in libFuzzer.
[workspace]
members = ["."]

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol"
path = "fuzz_targets/protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dbus_message"
path = "fuzz_targets/dbus_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "desktop_entry"
path = "fuzz_targets/desktop_entry.rs"
test = false
doc = false
bench = false
