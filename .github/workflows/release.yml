name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Take the version from the tag
        id: version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Check
        run: make check

  archives:
    name: archives
    needs: [version, check]
    runs-on: ubuntu-latest
    env:
      PSBOX_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - name: Build archives and the source archive
        run: |
          make dist
          make source

      - uses: actions/upload-artifact@v4
        with:
          name: archives
          path: dist/*.tar.gz

  arch:
    name: arch package
    needs: [version, check]
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      PSBOX_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel cargo git

      - name: Checkout
        uses: actions/checkout@v4

      # makepkg refuses to run as root.
      - name: Build the package
        run: |
          useradd -m builder
          chown -R builder .
          su builder -c "git config --global --add safe.directory '$PWD' && make package-arch"

      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*.pkg.tar.zst

  deb:
    name: debian package (${{ matrix.arch }})
    needs: [version, check]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:13
    env:
      PSBOX_VERSION: ${{ needs.version.outputs.version }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential debhelper rustup ca-certificates git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the package
        run: |
          git config --global --add safe.directory "$PWD"
          make package-deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb

  publish:
    name: publish
    needs: [archives, arch, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make checksums
          gh release create "$GITHUB_REF_NAME" --generate-notes dist/*
